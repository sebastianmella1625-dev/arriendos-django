{% extends 'base.html' %}

{% block title %}Eliminar inmueble{% endblock %}

{% block content %}
    <h1>Eliminar inmueble</h1>
    <p>¿Seguro que quieres eliminar <strong>{{ inmueble.nombre }}</strong> ({{ inmueble.direccion }})? Esta acción no se puede deshacer.</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="peligro">Sí, eliminar</button>
        <a href="{% url 'mis_inmuebles' %}">Cancelar</a>
    </form>
{% endblock %}
