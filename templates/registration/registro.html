{% extends 'base.html' %}

{% block title %}Crear cuenta{% endblock %}

{% block content %}
    <h1>Crear una cuenta</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Registrarse</button>
    </form>
    <p>¿Ya tienes cuenta? <a href="{% url 'login' %}">Inicia sesión</a></p>
{% endblock %}
